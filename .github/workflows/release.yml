name: Build and Release Multi-Platform Binaries

# Runs when a version tag (v*) is pushed, or manually (build only, no release).
# NOTE: the old `release: [published, created]` trigger was removed: creating a
# release also pushes its tag, so both triggers fired and raced to upload the
# same assets.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Get version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      # CGO off: fully static binaries. The system tray needs CGO on Linux/macOS,
      # so it is behind the `tray` build tag there (Windows keeps it, pure Go).
      - name: Build
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$GOOS" = "windows" ]; then
            BINARY="pt-${VERSION}-$GOOS-$GOARCH.exe"
          else
            BINARY="pt-${VERSION}-$GOOS-$GOARCH"
          fi
          echo "Binary name: $BINARY"

          go build -v -trimpath -ldflags="-s -w -X main.Version=${VERSION#v}" -o "$BINARY" ./pt
          ls -lh "$BINARY"

          sha256sum "$BINARY" > "$BINARY.sha256"
          cat "$BINARY.sha256"

          echo "BINARY=$BINARY" >> "$GITHUB_ENV"

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ${{ env.BINARY }}
            ${{ env.BINARY }}.sha256
          if-no-files-found: error
          retention-days: 90

  # .deb (Debian/Ubuntu), .apk (Alpine) and NSIS installer (Windows), each
  # smoke-tested (install -> PATH -> uninstall) before the release is published.
  packages:
    name: Packages (deb / apk / NSIS)
    uses: ./.github/workflows/packages.yml
    with:
      version: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

  release:
    name: Create Release
    needs: [build, packages]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts/

      - name: Prepare release files
        run: |
          mkdir -p release-files
          find artifacts -type f -exec cp {} release-files/ \;
          ls -lh release-files/

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-summary:
    name: Generate Release Summary
    needs: release
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Create Summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'
          # Release build complete

          ## Assets

          | Platform | Asset |
          |----------|-------|
          | Debian / Ubuntu (amd64, arm64) | `pt-go_<version>_amd64.deb`, `pt-go_<version>_arm64.deb` |
          | Alpine (x86_64, aarch64) | `pt-go_<version>_x86_64.apk`, `pt-go_<version>_aarch64.apk` |
          | Windows installer (amd64) | `pt-<version>-windows-amd64-setup.exe` |
          | Static binaries | `pt-<tag>-linux-{amd64,arm64}`, `pt-<tag>-darwin-{amd64,arm64}`, `pt-<tag>-windows-amd64.exe` |

          All assets have a `.sha256` file next to them.

          ## Install

          All packages install to `/TOOLS/pt` (Windows: `C:\TOOLS\pt`) and add that directory to the system PATH.

          ```bash
          # Debian / Ubuntu
          sudo apt install ./pt-go_<version>_amd64.deb

          # Alpine (packages are unsigned)
          apk add --allow-untrusted ./pt-go_<version>_x86_64.apk
          ```

          ```powershell
          # Windows (run as Administrator, or double-click the installer)
          .\pt-<version>-windows-amd64-setup.exe /S
          ```

          Open a new login shell / terminal afterwards so the PATH change is picked up.

          Linux needs `xclip`, `xsel` or `wl-clipboard` for clipboard access (installed automatically as a dependency). `delta` is optional (diff view).
          EOF
