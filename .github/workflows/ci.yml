name: Continuous Integration (Build Check)

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    name: Build Check - ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Download Dependencies
        run: go mod download

      - name: Verify Dependencies
        run: go mod verify

      # CGO is OFF on purpose: the system tray (getlantern/systray) needs CGO on
      # Linux/macOS, so it lives behind a build tag (see pt/tray.go, pt/tray_stub.go).
      # Default builds are fully static. Windows keeps the tray (pure Go).
      - name: Build Check
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          if [ "$GOOS" = "windows" ]; then
            OUTPUT="pt-$GOOS-$GOARCH.exe"
          else
            OUTPUT="pt-$GOOS-$GOARCH"
          fi
          go build -v -trimpath -ldflags="-s -w" -o "$OUTPUT" ./pt
          ls -lh "$OUTPUT"

      - name: Run Tests
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: go test -v ./...

  # The optional tray build on Linux (CGO + GTK3 + appindicator) must keep compiling.
  build-tray-linux:
    name: Build Check - linux tray (CGO, -tags tray)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Install GTK3 / appindicator headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libayatana-appindicator3-dev
      - name: Build with tray
        env:
          CGO_ENABLED: 1
        run: go build -v -tags tray -o pt-tray ./pt

  packages:
    name: Packages (deb / apk / NSIS)
    uses: ./.github/workflows/packages.yml
